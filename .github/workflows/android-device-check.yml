name: Android device journey (emulator + mock backend)

# Runs the real app on an Android emulator against the real FREYA backend in
# assistant-only mode with the deterministic mock provider (no API keys, no cost).
# Produces screenshots of each Core state as a workflow artifact.

on:
  workflow_dispatch:
  push:
    branches: ['feat/**']
    paths:
      - 'android/**'
      - '.github/workflows/android-device-check.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-device-check.yml'

permissions:
  contents: write   # only used to force-push results to the ci/device-journey branch

jobs:
  journey:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Start FREYA backend (assistant-only, mock provider)
        working-directory: backend
        env:
          FREYA_JWT_SECRET: ci-only-secret-for-emulator-journey-0123456789
          FREYA_RATE_LIMIT_PER_MINUTE: '200'
          FREYA_DB_PATH: ${{ runner.temp }}/freya-ci.sqlite3
        run: |
          python -m pip install --upgrade uv
          uv sync
          nohup uv run python run_freya.py > "$RUNNER_TEMP/backend.log" 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:5001/health; then echo; echo "backend up"; exit 0; fi
            sleep 2
          done
          cat "$RUNNER_TEMP/backend.log"; exit 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build app and test APKs
        working-directory: android
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon

      - name: Run journey on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          # Software-rendered emulators can't keep up with continuous animation and starve the
          # accessibility thread UI Automator needs. "Remove animations" makes FREYA use its
          # reduce-motion mode: every state stays distinct by colour and shape.
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: android
          script: |
            gradle :app:connectedDebugAndroidTest --no-daemon -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true || echo "TEST_FAILED" > ../journey-failed
            mkdir -p ../screenshots
            adb pull /sdcard/Android/data/ai.freya.app.debug/files/screenshots ../screenshots || true
            adb logcat -d -s FreyaJourney:V AndroidRuntime:E > ../journey-logcat.txt || true
            # Animated pass: re-enable animations, relaunch the signed-in app, and grab frames with
            # screencap (no accessibility needed), plus frame-time stats from gfxinfo.
            adb shell settings put global animator_duration_scale 1 || true
            adb shell settings put global transition_animation_scale 1 || true
            adb shell settings put global window_animation_scale 1 || true
            adb shell am force-stop ai.freya.app.debug || true
            adb shell dumpsys gfxinfo ai.freya.app.debug reset > /dev/null || true
            adb shell am start -n ai.freya.app.debug/ai.freya.app.MainActivity || true
            sleep 8
            mkdir -p ../screenshots/animated
            adb exec-out screencap -p > ../screenshots/animated/idle-1.png || true
            sleep 0.6
            adb exec-out screencap -p > ../screenshots/animated/idle-2.png || true
            sleep 0.6
            adb exec-out screencap -p > ../screenshots/animated/idle-3.png || true
            sleep 5
            adb shell dumpsys gfxinfo ai.freya.app.debug > ../screenshots/animated/gfxinfo.txt || true
            adb shell dumpsys meminfo ai.freya.app.debug > ../screenshots/animated/meminfo.txt || true
            adb shell input keyevent KEYCODE_HOME || true
            sleep 3
            adb shell dumpsys gfxinfo ai.freya.app.debug reset > /dev/null || true
            sleep 5
            adb shell dumpsys gfxinfo ai.freya.app.debug > ../screenshots/animated/gfxinfo-backgrounded.txt || true

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freya-device-journey
          path: |
            screenshots/
            journey-logcat.txt
            android/app/build/reports/androidTests/
            ${{ runner.temp }}/backend.log
          if-no-files-found: warn

      # Artifacts are also published to a throwaway branch so they can be fetched with plain git
      # (and browsed on GitHub) from environments that can't reach artifact storage.
      - name: Publish results to ci/device-journey branch
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PUB="$RUNNER_TEMP/pub"
          mkdir -p "$PUB"
          cp -r screenshots "$PUB/" 2>/dev/null || true
          cp journey-logcat.txt "$PUB/" 2>/dev/null || true
          cp "$RUNNER_TEMP/backend.log" "$PUB/" 2>/dev/null || true
          cp android/app/build/outputs/apk/debug/*.apk "$PUB/" 2>/dev/null || true
          cp -r android/app/build/outputs/androidTest-results "$PUB/" 2>/dev/null || true
          RESULT=PASSED; [ -f journey-failed ] && RESULT=FAILED
          printf "Device journey for %s (run %s): %s\n" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$RESULT" > "$PUB/README.md"
          cd "$PUB"
          git init -q -b ci/device-journey
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Device journey ${GITHUB_SHA::7}: $RESULT"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci/device-journey

      - name: Report journey details as an annotation
        if: always()
        run: |
          FAIL=$(grep -rhoE '<failure message="[^"]{0,1500}' android/app/build/outputs/androidTest-results 2>/dev/null | head -3)
          STEPS=$(grep -hE 'FreyaJourney|AndroidRuntime' journey-logcat.txt 2>/dev/null | sed -E 's/^.{0,32}(FreyaJourney|AndroidRuntime)/\1/' | tail -40)
          SHOTS=$(ls screenshots/screenshots 2>/dev/null | tr '\n' ' ')
          MSG=$(printf 'failure: %s\n---\nscreens: %s\n---\n%s' "$FAIL" "$SHOTS" "$STEPS" | head -c 20000 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::notice title=Journey details::${MSG}"

      - name: Fail if the journey failed
        run: test ! -f journey-failed
