plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'org.jetbrains.kotlin.plugin.serialization'
    id 'com.google.devtools.ksp'
}

// Override the API base URL at build time:
//   ./gradlew :app:assembleDebug -PFREYA_API_BASE_URL=https://your.host:5001
def apiBaseUrl = project.findProperty('FREYA_API_BASE_URL') ?: 'http://10.0.2.2:5001'

android {
    namespace 'ai.freya.app'
    compileSdk 35

    defaultConfig {
        applicationId "ai.freya.app"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "0.1.0"

        buildConfigField "String", "API_BASE_URL", "\"${apiBaseUrl}\""
        buildConfigField "String", "PERSONA_NAME", "\"FREYA\""
        buildConfigField "String", "PERSONA_TAGLINE", "\"One intelligence. Every interface. Your world.\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    // ---- Compose (BOM pins all androidx.compose.* versions) ----
    implementation platform('androidx.compose:compose-bom:2024.12.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'

    // ---- Core / Activity ----
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.activity:activity-compose:1.9.3'

    // ---- Lifecycle / ViewModel ----
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'

    // ---- Navigation Compose ----
    implementation 'androidx.navigation:navigation-compose:2.8.5'

    // ---- DataStore ----
    implementation 'androidx.datastore:datastore-preferences:1.1.1'

    // ---- Room ----
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    ksp 'androidx.room:room-compiler:2.6.1'

    // ---- Retrofit + OkHttp ----
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-kotlinx-serialization:2.11.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    implementation 'com.squareup.okhttp3:okhttp-sse:4.12.0'

    // ---- kotlinx.serialization ----
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.7.3'

    // ---- Coroutines ----
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
}
